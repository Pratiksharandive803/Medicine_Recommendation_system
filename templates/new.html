<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Location Finder</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            background: linear-gradient(to right, #dbeafe, #f0f9ff);
            font-family: Arial, sans-serif;
        }



        .main-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            margin-top: 20px;
            border: 3px solid #0d6efd;
        }

        .btn-custom {
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
        }

        .location-box {
            background: #e7f1ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 16px;
        }

        .hospital-list {
            margin-top: 20px;
        }

        .hospital-item {
            background: #f8f9fa;
            border-left: 5px solid #0d6efd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="main-card">

        <button class="btn btn-primary btn-custom" onclick="getLocation()">
            📍 Current Location & Nearby Hospitals
        </button>

        <div id="location" class="location-box mt-3">
            Your location details will appear here.
        </div>

        <div id="map"></div>

        <div class="hospital-list" id="hospital-list"></div>

    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;

function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}

function showPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    document.getElementById("location").innerHTML = `
        <strong>Latitude:</strong> ${lat.toFixed(4)} <br>
        <strong>Longitude:</strong> ${lon.toFixed(4)}
    `;

    if (map) {
        map.remove();
    }

    map = L.map('map').setView([lat, lon], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    L.marker([lat, lon]).addTo(map)
        .bindPopup("You are here")
        .openPopup();

    findNearbyHospitals(lat, lon);
}

async function findNearbyHospitals(lat, lon) {
    const hospitalList = document.getElementById("hospital-list");
    hospitalList.innerHTML = "<h3>Loading hospitals...</h3>";

    const query = `
        [out:json][timeout:25];
        (
          node["amenity"="hospital"](around:5000, ${lat}, ${lon});
          way["amenity"="hospital"](around:5000, ${lat}, ${lon});
          relation["amenity"="hospital"](around:5000, ${lat}, ${lon});
        );
        out center;
    `;

    try {
        const response = await fetch("https://overpass-api.de/api/interpreter", {
            method: "POST",
            body: query,
            headers: {
                "Content-Type": "text/plain"
            }
        });

        const data = await response.json();

        hospitalList.innerHTML = "<h3 class='mt-4'>🏥 Nearby Hospitals</h3>";

        if (!data.elements || data.elements.length === 0) {
            hospitalList.innerHTML += "<p>No hospitals found nearby.</p>";
            return;
        }

        data.elements.forEach((hospital, index) => {
            const name = hospital.tags?.name || "Unnamed Hospital";

            const latH = hospital.lat || hospital.center?.lat;
            const lonH = hospital.lon || hospital.center?.lon;

            if (!latH || !lonH) return;

            // Marker
            L.marker([latH, lonH]).addTo(map)
                .bindPopup(name);

            // List
            hospitalList.innerHTML += `
                <div class="hospital-item">
                    <strong>${index + 1}. ${name}</strong>
                </div>
            `;
        });

    } catch (error) {
        console.error(error);
        hospitalList.innerHTML = "<p>Error loading hospitals. Try again.</p>";
    }
}

function showError(error) {
    alert("⚠️ Please allow location access to see nearby hospitals.");
}
</script>

</body>
</html>
